<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Notre calendrier de l'avent</title>
  <meta name="theme-color" content="#fbf3ee">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎄</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css?v=4">
</head>
<body>
  <div class="flakes" id="flakes" aria-hidden="true"></div>

  <header class="hero">
    <p class="eyebrow" id="eyebrow"></p>
    <h1 id="title"></h1>
    <p class="subtitle" id="subtitle"></p>
    <p class="status" id="status" aria-live="polite"></p>
  </header>

  <main>
    <ol class="grid" id="grid" aria-label="Les 24 cases du calendrier"></ol>
  </main>

  <footer class="footer"><p id="footer"></p></footer>

  <dialog class="modal" id="modal" aria-labelledby="modal-title">
    <button class="modal-close" id="modal-close" aria-label="Fermer">&times;</button>
    <p class="modal-day" id="modal-day"></p>
    <h2 id="modal-title"></h2>
    <div class="modal-body" id="modal-body"></div>
  </dialog>

  <script src="content.js?v=4"></script>
  <script src="main.js?v=4"></script>
</body>
</html>
